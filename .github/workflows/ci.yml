name: Event CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  request-shape:
    name: event / request-shape
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate repository files
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --user pytest==8.3.5
          python3 -m pytest -q tests

  hostile-inputs:
    name: event / hostile-inputs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out trusted revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run shell syntax and hostile-input checks
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/lib/common.sh scripts/actions/*.sh scripts/admin/*.sh scripts/participant/*.sh scripts/scoring/*.sh tools/install-eventctl.sh
          python3 -m pip install --disable-pip-version-check --user pytest==8.3.5
          python3 -m pytest -q tests
